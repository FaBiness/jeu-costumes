<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Jeu des Costumes de Cinéma</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121214; color: #e2e8f0; padding: 10px; min-height: 100vh; }
        header { text-align: center; padding: 15px 5px; background: #1e1e24; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2d2d34; }
        header h1 { font-size: 1.5rem; color: #e5a93b; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: #94a3b8; }
        .game-container { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; max-width: 1200px; margin: 0 auto; }
        .costumes-column { display: flex; flex-direction: column; gap: 12px; }
        .movies-column { background-color: #1e1e24; padding: 12px; border-radius: 12px; border: 1px solid #2d2d34; position: sticky; top: 10px; }
        .movies-column h2 { font-size: 1.1rem; text-align: center; color: #e5a93b; margin-bottom: 12px; border-bottom: 1px solid #2d2d34; padding-bottom: 6px; }
        .costume-card { background-color: #1e1e24; border: 2px solid #2d2d34; border-radius: 10px; padding: 6px; position: relative; text-align: center; cursor: pointer; }
        .costume-card.selected { border-color: #e5a93b; box-shadow: 0 0 12px rgba(229, 169, 59, 0.4); background-color: #26262e; }
        .costume-card img { width: 100%; height: auto; max-height: 140px; object-fit: cover; border-radius: 6px; display: block; }
        .zoom-btn { position: absolute; top: 12px; right: 12px; background-color: rgba(0, 0, 0, 0.7); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; cursor: pointer; z-index: 5; }
        .assoc-badge { margin-top: 6px; background-color: #2d3748; color: #f7fafc; padding: 4px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: none; border-left: 3px solid #e5a93b; text-align: left; }
        .movie-list { display: flex; flex-direction: column; gap: 6px; }
        .movie-btn { background-color: #25252c; color: #cbd5e1; border: 1px solid #334155; padding: 10px 8px; border-radius: 6px; font-size: 0.85rem; text-align: left; cursor: pointer; width: 100%; }
        .movie-btn.linked { background-color: #1a2e1a; color: #64d2ff; border-color: #22543d; text-decoration: line-through; opacity: 0.5; }
        .actions { text-align: center; grid-column: 1 / -1; margin: 20px 0; }
        .validate-btn { background-color: #e5a93b; color: #121214; font-weight: bold; font-size: 1.1rem; padding: 12px 35px; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 300px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 10px; }
        .modal-content { max-width: 100%; max-height: 90vh; border-radius: 8px; }
        .form-box { background-color: #1e1e24; padding: 25px; border-radius: 12px; border: 1px solid #334155; width: 90%; max-width: 400px; text-align: center; }
        .form-box input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 1rem; }
        .form-box button { background-color: #e5a93b; color: #121214; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        
        @media (max-width: 768px) {
            .game-container { grid-template-columns: 1fr; }
            .movies-column { position: relative; top: 0; grid-row: 1; margin-bottom: 15px; }
            .costumes-column { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            #col-left { grid-row: 2; }
            #col-right { grid-row: 3; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Ciné-Costume Challenge</h1>
        <p>Touchez un costume (autour), puis choisissez son film (au centre) pour l'associer !</p>
    </header>

    <div class="game-container">
        <div class="costumes-column" id="col-left"></div>
        <div class="movies-column">
            <h2>🎥 Les 22 Films</h2>
            <div class="movie-list" id="movie-list-container"></div>
        </div>
        <div class="costumes-column" id="col-right"></div>
        <div class="actions">
            <button class="validate-btn" onclick="openNameModal()">Valider mes choix</button>
        </div>
    </div>

    <div id="zoom-modal" class="modal" onclick="this.style.display='none'">
        <img class="modal-content" id="zoomed-img">
    </div>

    <div id="form-modal" class="modal">
        <div class="form-box" id="modal-box-content">
            <h3>Enregistrement du score</h3>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px;">Entrez votre prénom pour voir votre score final :</p>
            <input type="text" id="player-name" placeholder="Votre prénom..." required>
            <button onclick="submitGame()">Découvrir mon score</button>
        </div>
    </div>

    <script>
        // CONFIGURATION DU JEU (Avec tes 22 vrais films !)
        // Remplace simplement les liens "https://picsum.photos/..." par les URL de tes photos.
        const GAME_DATA = [
            { id: 1, movie: "TRON", image: "https://picsum.photos/id/10/400/500" },
            { id: 2, movie: "BREAKING BAD", image: "https://picsum.photos/id/15/400/500" },
            { id: 3, movie: "BATMAN LE DÉFI", image: "https://picsum.photos/id/22/400/500" },
            { id: 4, movie: "BATMAN FOREVER", image: "https://picsum.photos/id/25/400/500" },
            { id: 5, movie: "FORREST GUMP", image: "https://picsum.photos/id/28/400/500" },
            { id: 6, movie: "LE SEPTIÈME FILS", image: "https://picsum.photos/id/30/400/500" },
            { id: 7, movie: "L'HOMME AU MASQUE DE FER", image: "https://picsum.photos/id/42/400/500" },
            { id: 8, movie: "DEMOLITION MAN", image: "https://picsum.photos/id/48/400/500" },
            { id: 9, movie: "LES 8 SALOPARDS", image: "https://picsum.photos/id/52/400/500" },
            { id: 10, movie: "V - THE SERIES", image: "https://picsum.photos/id/56/400/500" },
            { id: 11, movie: "STARSHIP TROOPERS", image: "https://picsum.photos/id/63/400/500" },
            { id: 12, movie: "THE ARTIST", image: "https://picsum.photos/id/65/400/500" },
            { id: 13, movie: "THE HUNGER GAMES", image: "https://picsum.photos/id/74/400/500" },
            { id: 14, movie: "ALERTE ! (OUTBREAK)", image: "https://picsum.photos/id/78/400/500" },
            { id: 15, movie: "PREDATOR", image: "https://picsum.photos/id/82/400/500" },
            { id: 16, movie: "STARGATE", image: "https://picsum.photos/id/88/400/500" },
            { id: 17, movie: "LE DERNIER EMPEREUR", image: "https://picsum.photos/id/92/400/500" },
            { id: 18, movie: "LA PLANÈTE DES SINGES", image: "https://picsum.photos/id/96/400/500" },
            { id: 19, movie: "GLADIATOR", image: "https://picsum.photos/id/102/400/500" },
            { id: 20, movie: "IL FAUT SAUVER LE SOLDAT RYAN", image: "https://picsum.photos/id/104/400/500" },
            { id: 21, movie: "LES VALEURS DE LA FAMILLE ADDAMS", image: "https://picsum.photos/id/112/400/500" },
            { id: 22, movie: "DIE HARD 2 - 58 MINUTES POUR VIVRE", image: "https://picsum.photos/id/122/400/500" }
        ];

        // COLLE TON URL DE DEPLOIEMENT GOOGLE SCRIPT ENTRE LES GUILLEMETS DES QUE TU L'AS
        const SCRIPT_URL = "METS_TON_URL_ICI";

        let selectedCostumeId = null;
        let assignments = {}; 

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function initGame() {
            const leftCol = document.getElementById('col-left');
            const rightCol = document.getElementById('col-right');
            const movieContainer = document.getElementById('movie-list-container');
            const shuffledCostumes = shuffle([...GAME_DATA]);
            const shuffledMovies = shuffle(GAME_DATA.map(d => d.movie));

            shuffledCostumes.forEach((costume, index) => {
                const card = document.createElement('div');
                card.className = 'costume-card';
                card.id = `costume-${costume.id}`;
                card.onclick = (e) => { if(!e.target.classList.contains('zoom-btn')) selectCostume(costume.id); };
                card.innerHTML = `
                    <button class="zoom-btn" onclick="zoomImage('${costume.image}', event)">🔍</button>
                    <img src="${costume.image}">
                    <div class="assoc-badge" id="badge-${costume.id}"></div>
                `;
                if (index < 11) leftCol.appendChild(card); else rightCol.appendChild(card);
            });

            shuffledMovies.forEach(movie => {
                const btn = document.createElement('button');
                btn.className = 'movie-btn';
                btn.id = `movie-btn-${btoa(encodeURIComponent(movie)).replace(/=/g, '')}`;
                btn.innerText = movie;
                btn.onclick = () => selectMovie(movie);
                movieContainer.appendChild(btn);
            });
        }

        function selectCostume(id) {
            if (selectedCostumeId) document.getElementById(`costume-${selectedCostumeId}`).classList.remove('selected');
            if (selectedCostumeId === id) { selectedCostumeId = null; return; }
            selectedCostumeId = id;
            document.getElementById(`costume-${id}`).classList.add('selected');
        }

        function selectMovie(movieTitle) {
            if (!selectedCostumeId) { alert("👉 Touchez d'abord une image de costume !"); return; }
            for (let cId in assignments) {
                if (assignments[cId] === movieTitle) {
                    delete assignments[cId];
                    document.getElementById(`badge-${cId}`).innerText = "";
                    document.getElementById(`badge-${cId}`).style.display = "none";
                }
            }
            assignments[selectedCostumeId] = movieTitle;
            const badge = document.getElementById(`badge-${selectedCostumeId}`);
            badge.innerText = `🎬 ${movieTitle}`;
            badge.style.display = "block";
            updateMovieButtonsStyle();
            document.getElementById(`costume-${selectedCostumeId}`).classList.remove('selected');
            selectedCostumeId = null;
        }

        function updateMovieButtonsStyle() {
            document.querySelectorAll('.movie-btn').forEach(btn => btn.classList.remove('linked'));
            for (let cId in assignments) {
                const title = assignments[cId];
                const btnId = `movie-btn-${btoa(encodeURIComponent(title)).replace(/=/g, '')}`;
                const btn = document.getElementById(btnId);
                if (btn) btn.classList.add('linked');
            }
        }

        function zoomImage(url, event) {
            event.stopPropagation();
            document.getElementById('zoomed-img').src = url;
            document.getElementById('zoom-modal').style.display = 'flex';
        }

        function openNameModal() {
            document.getElementById('form-modal').style.display = 'flex';
        }

        function submitGame() {
            const name = document.getElementById('player-name').value.trim();
            if (!name) { alert("Entre ton prénom !"); return; }
            let score = 0;
            GAME_DATA.forEach(item => { if (assignments[item.id] === item.movie) score++; });

            if (SCRIPT_URL !== "METS_TON_URL_ICI") {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player: name, score: score, total: 22, date: new Date().toLocaleString('fr-FR') })
                }).catch(e => console.log(e));
            }

            document.getElementById('modal-box-content').innerHTML = `
                <h3 style="color: #e5a93b; font-size: 1.8rem;">Merci ${name} !</h3>
                <div style="font-size: 3.5rem; font-weight: bold; margin: 20px 0; color: #64d2ff;">${score} / 22</div>
                <p style="color: #cbd5e1; margin-bottom: 20px; font-size: 0.9rem;">Ton score a été enregistré. Rejoue pour t'améliorer, les détails des erreurs restent masqués !</p>
                <button onclick="window.location.reload()">Rejouer 🔄</button>
            `;
        }
        window.onload = initGame;
    </script>
</body>
</html>
